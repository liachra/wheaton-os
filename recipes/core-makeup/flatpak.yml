modules:
  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - io.github.peazip.PeaZip # advanced archiving software with capabilities on par with Windows packages 7zip and WinRAR
          - com.github.tchx84.Flatseal
          - com.usebottles.bottles
          - io.github.flattool.Warehouse
          - com.obsproject.Studio # advanced video recording and live streaming software with capabilities
        repo:
          title: GeForce Now
          url: https://international.download.nvidia.com/GFNLinux/flatpak/geforcenow.flatpakrepo
        install:
          - com.nvidia.geforcenow # GeForce Now client for Linux, allowing access to a wide range of games via cloud gaming