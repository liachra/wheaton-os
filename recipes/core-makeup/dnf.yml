modules:
  - type: dnf
    install:
      packages:
        - android-tools # adb/fastboot for Android devices (Needed to install GrapheneOS, our recommended Android based OS
        - syncthing
        - snapshot # Gnome Camera
        - haruna # need to find MPV specific replacement, Celluloid is a good alternaitve but missing QoL features
        - loupe # Gnome Image Viewer
        - strawberry # I wish there was a GTK replacement that has proper DAC control via ALSA however there simply isn't
        - okular # might find a GTK replacement but this is known to have great features
        - qbittorrent # much more configuable than GTK alternatives, will be kept
        - gnome-shell-extension-blur-my-shell
        - gnome-shell-extension-dash-to-dock
        - gnome-shell-extension-gsconnect
        - thunderbird
        - waydroid # Android in a container, allows you to run Android apps on Linux.