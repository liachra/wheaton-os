type: default-flatpak
confiigurations:
  - scope: system
    repo:
      title: Flathub (system)
    remove:
      - org.gnome.Loupe # inplace of system package
      - org.gnome.Snapshot # inplace of system package
      - org.gnome.Showtime # inplace of Hurana system package, Qt program with better features than GTK alternatives
