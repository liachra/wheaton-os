---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: wheaton-os
description: A sensible linux distro with QoL improvements

base-image: ghcr.io/ublue-os/bazzite-gnome
image-version: 44

modules:
  - type: files
    files:
      - source: system
        destination: /
  - from-file: core-makeup/dnf.yml
  - from-file: core-makeup/flatpak.yml
  - from-file: core-kargs/nosmt.yml
  - from-file: core-makeup/brave-browser.yml
  - from-file: core-makeup/bazzite-removals.yml

  - type: signing # this sets up the proper policy & signing files for signed images to work fully