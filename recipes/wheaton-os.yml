---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: wheaton-os
description: A sensibly secure linux distro with QoL improvements

base-image: ghcr.io/secureblue/silverblue-main-hardened
image-version: 44

modules:
  - type: files
    files:
      - source: system
        destination: /
  - from-file: recipes/core-makeup/dnf.yml
  - from-file: recipes/core-makeup/flatpak.yml
  - from-file: recipes/core-kargs/nosmt.yml
  - from-file: recipes/core-kargs/32bit-disable.yml
  - from-file: recipes/core-makeup/brave-browser.yml # Will be replaced by SecureBlue's Trivalent once a P2P browser sync tool is built (simular to XBrowserSync), if at all possible

  - type: signing # this sets up the proper policy & signing files for signed images to work fully