type: kargs
kargs:
  - nosmt=force # Force disable SMT/Multi-threading - Major security flaws have been found mith multi-threading on ALL OPERATING SYSTEMS using x86. It is assumed only certain CPUs are effected but exploit risk so severe that should be disblaed anyway. Use `ujust toggle-cpu-exploir` if you require multi-threading *note gamers might want to leave SMT disabled as games are single threaded anyway and current testing shows slight improvment when disabled anyway. Only people should need multithreading are video editors, developers compiling large programs like browsers or kernels and people whom regulally use VMs*